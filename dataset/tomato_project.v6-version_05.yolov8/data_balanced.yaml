# Class-balancing supplement on top of the v6 export (data.yaml).
# valid/ and test/ are untouched -- only train gets extra, offline-augmented
# defect images (generated by augment_defect_class.py into the sibling folder
# tomato_defect_augmented_v6/), so test-set metrics stay an honest,
# unaugmented measure. See train_local.py / augment_defect_class.py docstrings.
path: D:/Research/dataset/tomato_project.v6-version_05.yolov8
train:
  - train/images
  - ../tomato_defect_augmented_v6/images
val: valid/images
test: test/images

nc: 5
names: ['breaker', 'defect', 'green', 'red', 'turning']
